# Builds the signed APK on GitHub's servers and publishes it, so releases do not depend
# on whoever holds the keystore on their laptop.
#
# Run: GitHub > Actions > "Release APK" > Run workflow > choose the branch.
#  1. Fails early if the release v<versionName> already exists (raise the version first).
#  2. ./gradlew publishUpdate: unit tests (incl. migration coverage), signed release
#     APK, update.json written from that APK.
#  3. Creates the GitHub Release v<versionName> with the APK attached.
#  4. Commits update.json to the SAME branch. Only phones built from that branch are
#     offered the update; rolling out to participants is still a deliberate step
#     (see README, "Releasing an update").
#
# Secrets (Settings > Secrets and variables > Actions), see README:
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
#   INGEST_URL + INGEST_APP_TOKEN, or (testing only) GATEWAY_URL + API_KEY + DB_NAME

name: Release APK

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release (for testing; not shown as the latest release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name from branch ${GITHUB_REF_NAME}"

      - name: Stop if this version was already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.name }}" >/dev/null 2>&1; then
            echo "::error::Release v${{ steps.version.outputs.name }} already exists. Raise versionCode and versionName in app/build.gradle.kts first."
            exit 1
          fi

      # 21 matches gradle/gradle-daemon-jvm.properties; the app still targets Java 17
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Write .env and keystore from secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_APP_TOKEN: ${{ secrets.INGEST_APP_TOKEN }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set (see README)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Same format as a local .env: values in double quotes
          {
            echo "SIGNING_STORE_FILE=\"$RUNNER_TEMP/release.keystore\""
            echo "SIGNING_STORE_PASSWORD=\"$SIGNING_STORE_PASSWORD\""
            echo "SIGNING_KEY_ALIAS=\"$SIGNING_KEY_ALIAS\""
            echo "SIGNING_KEY_PASSWORD=\"$SIGNING_KEY_PASSWORD\""
            if [ -n "$INGEST_URL" ]; then
              echo "INGEST_URL=\"$INGEST_URL\""
              echo "INGEST_APP_TOKEN=\"$INGEST_APP_TOKEN\""
            else
              echo "GATEWAY_URL=\"$GATEWAY_URL\""
              echo "API_KEY=\"$API_KEY\""
              echo "DB_NAME=\"$DB_NAME\""
            fi
            echo "GITHUB_REPO=\"$GITHUB_REPOSITORY\""
          } > .env

      - name: Test, build and sign (publishUpdate)
        run: |
          chmod +x gradlew
          # gradle.properties pins org.gradle.java.home to a Windows JDK path from one
          # laptop; a -D on the command line takes precedence, so use this runner's JDK
          ./gradlew publishUpdate --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${{ steps.version.outputs.name }}"
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "v$name" "releases/DataHarvester-$name.apk" \
            --target "$GITHUB_SHA" \
            --title "Data Harvester $name" \
            --notes "Built by GitHub Actions from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. See README for install and update steps." \
            $flags

      - name: Check the APK downloads
        run: |
          url=$(sed -n 's/.*"apkUrl": "\(.*\)".*/\1/p' update.json)
          curl -fsSL --retry 5 --retry-delay 5 -o downloaded.apk "$url"
          cmp downloaded.apk "releases/DataHarvester-${{ steps.version.outputs.name }}.apk"
          echo "Downloaded and matches: $url"

      - name: Commit update.json to ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "update.json: ${{ steps.version.outputs.name }} (GitHub Actions)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
